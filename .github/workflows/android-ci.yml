name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/growth-organico-v1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK home: ${ANDROID_HOME:?ANDROID_HOME must be set by the runner}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      # Release uses R8/minified resources unlike Debug. Compile it before any merge.
      # No signing secret is installed in CI; this is validation, not a Play upload.
      - name: Validate unit tests and Debug + Release builds
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calcmot-debug-apks
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 7
